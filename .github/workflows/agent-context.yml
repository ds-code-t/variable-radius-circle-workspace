name: Agent Context and Project Validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew setup-agent.sh scripts/*.sh scripts/*.py

      - name: Verify agent contract
        run: python scripts/verify_agent_contract.py

      - name: Verify generated repository index
        run: python scripts/refresh_agent_index.py --check

      - name: Enforce pull-request change coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/verify_agent_contract.py --base-ref "$BASE_REF" --strict

      - name: Run existing documentation checks
        run: |
          if [[ -x scripts/verify-agent-docs.sh ]]; then
            scripts/verify-agent-docs.sh
          fi

      - name: Run Gradle checks
        run: ./gradlew clean check
