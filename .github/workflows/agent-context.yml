name: Agent Context Consistency

on:
  pull_request:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify agent-context structure
        run: ./scripts/verify-agent-docs.sh --structure-only

      - name: Verify documentation accompanies code changes
        if: github.event_name == 'pull_request'
        env:
          AGENT_DOCS_BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/verify-agent-docs.sh
